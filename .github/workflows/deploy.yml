name: Deploy ContactUs Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run deploy script on VPS
        uses: appleboy/ssh-action@v1.0.3  # Oxirgi barqaror versiyaga yangilandi
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Muhitni yuklash (PM2 va Python yo'llarini topish uchun)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Loyiha papkasiga o'tish
            cd /opt/tgbot/contactus

            # 3. Kodni yangilash
            git fetch origin main
            git reset --hard origin/main

            # 4. Kutubxonalarni yangilash
            pip install --no-cache-dir -r requirements.txt

            # 5. PM2 orqali botni qayta ishga tushirish
            # --interpreter orqali python3 ni ko'rsatish eng xavfsiz yo'l
            pm2 delete contactus-bot || true
            pm2 start app.py --name contactus-bot --interpreter python3
            pm2 save
